<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTY Small Customer 360 Demo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --border: #e5e7eb;
      --telia: #990ae3;
      --blue: #0078d4;
      --shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      position: relative;
      background: linear-gradient(135deg, #3b0764, var(--telia));
      color: white;
      padding: 28px 32px;
    }

    .header-content { padding-right: 220px; }
    header h1 { margin: 0 0 8px; font-size: 28px; }
    header p { margin: 0; opacity: 0.9; }

    .language-switcher {
      position: absolute;
      top: 24px;
      right: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language-switcher .language-icon {
      font-size: 18px;
      line-height: 1;
    }

    .language-switcher button {
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.12);
      color: white;
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 800;
    }

    .language-switcher button.active {
      background: white;
      color: #3b0764;
      border-color: white;
    }

    .settings-button {
      border: 1px solid rgba(255,255,255,0.45);
      background: rgba(255,255,255,0.12);
      color: white;
      border-radius: 999px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      font-size: 18px;
      display: grid;
      place-items: center;
      transition: all 0.15s ease;
    }

    .settings-button:hover {
      background: white;
      color: #3b0764;
      border-color: white;
      transform: rotate(20deg);
    }


    main {
      padding: 28px 32px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.35fr 1.25fr 1fr 1.15fr;
      gap: 16px;
      align-items: end;
      margin-bottom: 20px;
    }

    label { display: block; font-weight: 600; margin-bottom: 6px; }

    select, input {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      background: white;
    }

    .search-mode {
      min-height: 44px;
      display: grid;
      gap: 6px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: white;
      padding: 8px 10px;
    }

    .radio-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .radio-line input { width: auto; margin: 0; }

    .kpis {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }

    .kpi {
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      border-radius: 999px;
      padding: 8px 12px;
      box-shadow: none;
      cursor: pointer;
      font-weight: 800;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .kpi:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      border-color: #fdba74;
    }

    .kpi.active {
      border-color: var(--telia);
      background: #fbf5ff;
      color: #55208a;
      box-shadow: 0 8px 20px rgba(153, 10, 227, 0.12);
    }

    .kpi .label { color: inherit; font-size: 13px; }
    .kpi .value { font-size: 13px; font-weight: 900; margin-top: 0; }

    .layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .panel-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(135deg, #fbf5ff, #ffffff);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    .panel-header h2 { margin: 0; font-size: 20px; }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: #fbfcfe;
    }

    .tab {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      cursor: pointer;
      font-weight: 600;
    }

    .tab.active { background: var(--telia); color: white; border-color: var(--telia); }
    .list { padding: 8px; }

    .row {
      display: grid;
      grid-template-columns: 44px minmax(0, 1fr) auto;
      gap: 12px;
      padding: 14px 12px;
      border-radius: 12px;
      align-items: center;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .row:hover { background: #f8f5ff; border-color: #ead7ff; }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #f3e8ff;
      color: var(--telia);
      display: grid;
      place-items: center;
      font-size: 20px;
    }



    .row-details {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .row-detail-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--border);
      background: #fbfcfe;
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      max-width: 100%;
    }

    .row-detail-chip strong {
      color: var(--text);
      font-weight: 800;
    }



    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }
    .row-action-button {
      border: 1px solid var(--border);
      background: white;
      color: var(--blue);
      border-radius: 999px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 800;
      font-size: 12px;
      font-family: inherit;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .row-action-button.primary { background: var(--telia); border-color: var(--telia); color: white; }
    .row-action-button.warning { background: #fff7ed; border-color: #fed7aa; color: #9a3412; }
    .row-action-button:hover { box-shadow: 0 6px 18px rgba(15, 23, 42, 0.08); transform: translateY(-1px); }
    .record-summary { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .record-summary-item { border: 1px solid var(--border); background: #fbfcfe; border-radius: 12px; padding: 12px; }
    .record-summary-label { color: var(--muted); font-size: 12px; font-weight: 800; margin-bottom: 4px; }
    .record-summary-value { font-weight: 800; overflow-wrap: anywhere; }
    .thread { display: grid; gap: 10px; }
    .thread-message { border: 1px solid var(--border); border-radius: 14px; padding: 12px; background: #fbfcfe; }
    .thread-message.customer { background: #f8f5ff; border-color: #ead7ff; }
    .thread-meta { color: var(--muted); font-size: 12px; font-weight: 800; margin-bottom: 5px; }
    .thread-text { line-height: 1.45; }
    @media (max-width: 700px) { .record-summary { grid-template-columns: 1fr; } }

    .primary { font-weight: 700; }
    .secondary { color: var(--muted); font-size: 13px; margin-top: 4px; }

    .badge {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 5px 9px;
      font-size: 12px;
      font-weight: 700;
      background: #f3f4f6;
      color: #374151;
      white-space: nowrap;
    }

    .badge.target { background: #ecfdf3; color: #067647; }
    .badge.legacy { background: #fff7ed; color: #c2410c; }
    .badge.open { background: #fef3c7; color: #92400e; }

    .detail { position: sticky; top: 20px; }
    .detail-body { padding: 20px; }
    .empty { color: var(--muted); padding: 24px; text-align: center; }
    .detail-title { margin: 0 0 4px; font-size: 23px; }
    .detail-subtitle { color: var(--muted); margin-bottom: 18px; }
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .info {
      border: 1px solid var(--border);
      background: #fbfcfe;
      border-radius: 12px;
      padding: 12px;
    }

    .info .name { color: var(--muted); font-size: 12px; margin-bottom: 5px; }
    .info .val { font-weight: 700; overflow-wrap: anywhere; }
    .actions { margin-top: 18px; }
    .actions h3 { margin: 0 0 10px; font-size: 16px; }

    .action-button {
      width: 100%;
      margin: 6px 0;
      padding: 10px 12px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 10px;
      text-align: left;
      font-weight: 600;
    }

    .related { margin-top: 18px; }
    .mini-list { display: grid; gap: 8px; }

    .mini-item {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      background: #fbfcfe;
      font-size: 13px;
    }

    .news {
      display: grid;
      gap: 6px;
      margin: 8px 0 10px;
    }

    .news-card {
      background: #fff8e1;
      border: 1px solid #fde68a;
      color: #78350f;
      border-radius: 10px;
      padding: 7px 10px;
      font-weight: 600;
      font-size: 13px;
    }



    .news-card {
      position: relative;
      display: grid;
      gap: 4px;
    }

    .news-card-text {
      padding-right: 26px;
      line-height: 1.25;
    }

    .news-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }

    .news-readmore {
      border: 0;
      background: transparent;
      color: var(--blue);
      font-weight: 800;
      cursor: pointer;
      padding: 0;
      font: inherit;
    }

    .news-readmore:hover { text-decoration: underline; }

    .news-close {
      position: absolute;
      top: 5px;
      right: 8px;
      border: 0;
      background: transparent;
      color: #78350f;
      font-size: 16px;
      line-height: 1;
      cursor: pointer;
      opacity: 0.75;
    }

    .news-close:hover { opacity: 1; }

    .news-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, 0.42);
      padding: 24px;
    }

    .news-modal[hidden] { display: none; }

    .news-modal-content {
      width: min(620px, 100%);
      background: white;
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      overflow: hidden;
    }

    .news-modal-header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    .news-modal-header h3 {
      margin: 0;
      font-size: 21px;
    }

    .news-modal-close {
      border: 0;
      background: #f3f4f6;
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .news-modal-body {
      padding: 22px;
      color: var(--text);
      line-height: 1.55;
    }

    .news-modal-body p { margin: 0 0 12px; }

    .news-modal-body ul {
      margin: 8px 0 0;
      padding-left: 20px;
    }

    .news-modal-footer {
      padding: 16px 22px 22px;
      display: flex;
      justify-content: flex-end;
    }

    .news-modal-button {
      border: 0;
      background: var(--telia);
      color: white;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 800;
    }

    .ai-panel { display: none; margin: 20px 0; }
    .ai-answer { padding: 20px; }
    .ai-answer h3 { margin: 0 0 8px; font-size: 22px; }
    .ai-answer-text { line-height: 1.6; color: var(--text); }
    .source-list { display: grid; gap: 10px; margin-top: 16px; }

    .source-link {
      display: block;
      border: 1px solid var(--border);
      background: #fbfcfe;
      border-radius: 12px;
      padding: 12px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
    }

    .source-link:hover { text-decoration: underline; }
    .suggestion-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }

    .suggestion-button {
      border: 1px solid #ead7ff;
      background: #f8f5ff;
      color: #55208a;
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .view-toggle {
      display: flex;
      gap: 10px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: #fbfcfe;
    }

    .view-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 999px;
      padding: 8px 14px;
      cursor: pointer;
      font-weight: 700;
      color: var(--text);
    }

    .view-btn.active { background: var(--telia); color: white; border-color: var(--telia); }

    .tile-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 16px;
      padding: 16px;
    }

    .asset-tile {
      background: white;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .asset-tile:hover { transform: translateY(-2px); box-shadow: var(--shadow); border-color: #ead7ff; }
    .asset-tile-title { font-weight: 800; margin-bottom: 8px; font-size: 16px; }
    .asset-tile-sub { color: var(--muted); font-size: 13px; margin-bottom: 6px; line-height: 1.4; }

    .filter-banner {
      margin: 8px 8px 0;
      padding: 10px 14px;
      border: 1px solid #ead7ff;
      background: #f8f5ff;
      color: #55208a;
      border-radius: 12px;
      font-weight: 700;
    }

    .detail-link {
      display: inline-block;
      margin-top: 8px;
      color: var(--blue);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .detail-link:hover { text-decoration: underline; }

    .summary-card {
      border: 1px solid var(--border);
      background: #fbfcfe;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .summary-card h3 { margin: 0 0 10px; font-size: 18px; }

    .summary-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 0;
      border-bottom: 1px solid #eef2f7;
      font-size: 14px;
    }

    .summary-row:last-child { border-bottom: 0; }
    .summary-row strong { font-size: 15px; }



    .quick-actions {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 18px 20px;
      margin: 0 0 20px;
    }

    .quick-actions-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 14px;
    }

    .quick-actions-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .quick-actions-header p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .quick-action-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .quick-action-card {
      border: 1px solid var(--border);
      background: #fbfcfe;
      border-radius: 16px;
      padding: 16px;
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr);
      gap: 12px;
      align-items: center;
      text-align: left;
      cursor: pointer;
      color: var(--text);
      font: inherit;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .quick-action-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: #ead7ff;
      background: white;
    }

    .quick-action-icon {
      width: 46px;
      height: 46px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      background: #f3e8ff;
      color: var(--telia);
      font-size: 22px;
    }

    .quick-action-title {
      display: block;
      font-weight: 900;
      margin-bottom: 3px;
    }

    .quick-action-desc {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.35;
    }

    .action-modal {
      position: fixed;
      inset: 0;
      z-index: 1100;
      display: grid;
      place-items: center;
      background: rgba(15, 23, 42, 0.42);
      padding: 24px;
    }

    .action-modal[hidden] { display: none; }

    .action-modal-content {
      width: min(960px, 95vw);
      max-height: 92vh;
      background: white;
      border-radius: 20px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .action-modal-header {
      padding: 20px 22px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }

    .action-modal-header h3 {
      margin: 0;
      font-size: 21px;
      line-height: 1.25;
    }
    .modal-title-line { display: flex; align-items: center; gap: 10px; }
    .modal-title-icon { font-size: 24px; }
    .modal-subtitle { color: var(--muted); font-size: 13px; font-weight: 600; margin-top: 4px; }

    .action-modal-close {
      border: 0;
      background: #f3f4f6;
      color: var(--text);
      width: 34px;
      height: 34px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    .action-modal-body {
      padding: 22px;
      display: grid;
      gap: 16px;
      overflow: auto;
    }

    .form-row label {
      font-size: 13px;
      color: var(--muted);
      font-weight: 800;
    }

    .form-row textarea {
      width: 100%;
      min-height: 96px;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      font-family: inherit;
      resize: vertical;
    }

    .action-modal-footer {
      padding: 14px 22px 18px;
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      border-top: 1px solid var(--border);
      background: white;
      position: sticky;
      bottom: 0;
      z-index: 2;
    }

    .secondary-button,
    .primary-button {
      border: 0;
      border-radius: 999px;
      padding: 10px 18px;
      cursor: pointer;
      font-weight: 800;
    }

    .secondary-button { background: #f3f4f6; color: var(--text); }
    .primary-button { background: var(--telia); color: white; }



    .contact-option-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .contact-option {
      border: 1px solid var(--border);
      background: #fbfcfe;
      border-radius: 16px;
      padding: 16px;
      text-align: left;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      display: grid;
      gap: 6px;
      min-height: 116px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .contact-option:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: #ead7ff;
      background: white;
    }

    .contact-option.primary {
      border-color: #ead7ff;
      background: #f8f5ff;
    }

    .contact-option-icon { font-size: 26px; }
    .contact-option-title { font-weight: 900; }
    .contact-option-desc { color: var(--muted); font-size: 13px; line-height: 1.35; }

    @media (max-width: 900px) {
      .contact-option-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 900px) {
      .quick-action-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 1100px) {
      .toolbar { grid-template-columns: 1fr; }
      .layout { grid-template-columns: 1fr; }
      .detail { position: static; }
    }

    @media (max-width: 700px) {
      .header-content { padding-right: 0; padding-top: 48px; }
      .language-switcher { left: 32px; right: auto; top: 20px; }
    }


    .status-banner {
      border-radius: 14px;
      padding: 12px 14px;
      font-weight: 900;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      width: fit-content;
      border: 1px solid var(--border);
      background: #f3f4f6;
      color: #374151;
    }
    .status-banner.open { background: #fef3c7; color: #92400e; border-color: #fde68a; }
    .status-banner.paid, .status-banner.resolved, .status-banner.completed { background: #ecfdf3; color: #067647; border-color: #abefc6; }
    .status-banner.progress { background: #f3e8ff; color: #55208a; border-color: #ead7ff; }

    .record-summary { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .record-summary-item { background: linear-gradient(180deg, #ffffff, #fbfcfe); border-radius: 14px; padding: 14px; min-height: 74px; }
    .record-summary-label { font-weight: 900; margin-bottom: 6px; }
    .record-summary-value { font-weight: 900; font-size: 15px; }

    .thread { display: grid; gap: 12px; }
    .thread-message { max-width: 74%; justify-self: start; border-radius: 16px; padding: 12px 14px; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04); }
    .thread-message.customer { justify-self: end; }
    .thread-meta { font-weight: 900; margin-bottom: 6px; }

    .timeline { display: grid; gap: 8px; border-left: 2px solid #ead7ff; padding-left: 14px; }
    .timeline-item { position: relative; color: var(--muted); font-size: 13px; line-height: 1.4; }
    .timeline-item::before { content: ""; position: absolute; left: -20px; top: 4px; width: 10px; height: 10px; border-radius: 999px; background: var(--telia); }
    .timeline-item strong { color: var(--text); }

    .pdf-preview { border: 1px solid var(--border); background: #ffffff; border-radius: 16px; padding: 22px; box-shadow: inset 0 0 0 1px #f3f4f6; }
    .pdf-preview-header { display: flex; justify-content: space-between; gap: 16px; border-bottom: 2px solid #111827; padding-bottom: 12px; margin-bottom: 16px; font-weight: 900; }
    .pdf-preview-title { font-size: 22px; color: var(--telia); }
    .pdf-preview-total { margin-top: 18px; padding: 14px; border-radius: 12px; background: #f8f5ff; font-size: 20px; font-weight: 900; }

    @media (max-width: 700px) {
      .thread-message { max-width: 100%; justify-self: stretch; }
      .thread-message.customer { justify-self: stretch; }
    }

  .current-user-pill { margin-top:14px; display:inline-flex; align-items:center; gap:8px; padding:10px 14px; border-radius:999px; background:rgba(255,255,255,0.15); border:1px solid rgba(255,255,255,0.25); color:white; font-size:13px; font-weight:800; }
.demo-user-card { width:100%; border:1px solid var(--border); background:white; border-radius:16px; padding:16px; text-align:left; cursor:pointer; display:grid; gap:8px; transition:all .2s ease; }
.demo-user-card:hover { transform:translateY(-2px); box-shadow:var(--shadow); border-color:#ead7ff; }
.demo-user-card.active { border-color:var(--telia); background:#fbf5ff; box-shadow:0 10px 24px rgba(153,10,227,.15); }

      const thirdCompany = companies[2]?.companyId || firstCompany;
      const assetUsers = [...new Set(assets.map(a => a.user).filter(Boolean))];

      demoUsers.forEach(user => {

    function accessibleCompanyIds(user = currentDemoUser()) {

      if (user.role === 'enduser') {

      }

    function isCompanyAllowed(companyId) {

    function ensureAllowedState() {
      const allowedTabs = availableTabs();

      if (currentDemoUser().role === 'admin') return;
      if (state.selectedCompanyId === 'ALL' && allowedCompanies.length > 1) return;

    function translateStatus(value) {
      const raw = String(value || '');
      const v = raw.toLowerCase();
      if (v === 'avoinna') return t('open');
      if (v === 'valmis') return t('completed');
      if (v === 'maksettu') return t('paid');
      if (v === 'ratkaistu') return t('resolved');
      if (v.includes('käsittelyssä')) return t('inProgress');
      if (v.includes('selvityksessä')) return t('underInvestigation');
      if (v.includes('tilauksessa')) return t('ordered');
      return raw;
    }

      const raw = String(value || '');

      return raw;

    async function loadData() {
      const entries = await Promise.all(Object.entries(files).map(async ([key, path]) => {
        const response = await fetch(path);
        if (!response.ok) throw new Error(`Dataa ei voitu ladata: ${path}`);
        return [key, await response.json()];
      }));
      state.data = Object.fromEntries(entries);
      state.data.contentSearch = await loadOptionalJson('data/content-search.json', []);
      bootstrapDemoUsers();
      state.selectedCompanyId = pickDefaultCompany();
      initControls();
      renderAll();
    }

    async function loadOptionalJson(path, fallback) {
      try {
        const response = await fetch(path + `?v=${Date.now()}`, { cache: 'no-store' });
        if (!response.ok) return fallback;
        const data = await response.json();
        return Array.isArray(data) ? data : fallback;
      } catch (error) { return fallback; }
    }

      companySelect.innerHTML =

          .map(c => `<option value="${escapeHtml(c.companyId)}">${escapeHtml(c.companyName)} (${escapeHtml(c.companyId)})</option>`)
          .join('');
      companySelect.value = showAllOption ? currentValue : (allowedCompanies[0]?.companyId || 'ALL');
      state.selectedCompanyId = companySelect.value || 'ALL';

    function initNewsReturnCounter() {
      if (window.__mtyNewsReturnCounterInitialized) return;
      window.__mtyNewsReturnCounterInitialized = true;
      document.addEventListener('click', () => {
        if (localStorage.getItem('mtyNewsDismissed') !== 'true') return;
        const clicks = Number(localStorage.getItem('mtyNewsReturnClicks') || '0') + 1;
        if (clicks >= 10) {
          localStorage.removeItem('mtyNewsDismissed');
          localStorage.removeItem('mtyNewsReturnClicks');
          renderNews();
        } else {
          localStorage.setItem('mtyNewsReturnClicks', String(clicks));
        }
      });
    }

    function newsModalContent(news) {
      const text = String(news.text || '');
      const lower = text.toLowerCase();
      if (news.title || news.details) {
        return {
          title: news.title || newsUiText('details'),
          html: `<p>${escapeHtml(news.details || news.text || '')}</p>`
        };
      }
      if (lower.includes('määräaik') || lower.includes('sopim')) {
        return { title: newsUiText('contractTitle'), html: newsUiText('contractDetails') };
      }
      if (lower.includes('verkonkorja') || lower.includes('verkko')) {
        return { title: newsUiText('networkTitle'), html: newsUiText('networkDetails') };
      }
      return { title: newsUiText('details'), html: `<p>${escapeHtml(text)}</p>` };
    }

        <button class="quick-action-card" type="button" onclick="openActionModal('${type}')">
          <span class="quick-action-icon">${icon}</span>
          <span>
            <span class="quick-action-title">${escapeHtml(title)}</span>
            <span class="quick-action-desc">${escapeHtml(description)}</span>
          </span>
        </button>`;
    }

    function openActionModal(type) {
      state.activeActionType = type;
      setModalHeader(actionIconForModal(type), actionTitle(type));
      document.getElementById('actionModalBody').innerHTML = actionModalBody(type);
      document.getElementById('actionModalCancel').textContent = t('modalCancel');
      const submitButton = document.getElementById('actionModalSubmit');
      submitButton.textContent = type === 'order' ? t('modalContinue') : t('modalSubmit');
      submitButton.style.display = type === 'contact' ? 'none' : 'inline-block';
      document.getElementById('actionModal').hidden = false;
    }

    function closeActionModal() {
      document.getElementById('actionModal').hidden = true;
      document.getElementById('actionModalSubmit').style.display = 'inline-block';
      state.activeActionType = null;
      state.activeRecordType = null;
      state.activeRecordId = null;
    }

    function actionIconForModal(type) {
      if (type === 'order') return '🛒';
      if (type === 'contact') return '💬';
      if (type === 'request') return '🛠️';
      if (type === 'incident') return '⚠️';
      return 'ℹ️';
    }

    function actionTitle(type) {
      if (type === 'order') return t('orderNewService');
      if (type === 'contact') return t('contactUs');
      if (type === 'request') return t('createServiceRequest');
      if (type === 'incident') return t('reportIncident');
      return t('quickActions');
    }

              <span class="contact-option-desc">${escapeHtml(t('chatDesc'))}</span>

            <button class="contact-option" type="button" onclick="openActionModal('request')">

              <span class="contact-option-desc">${escapeHtml(t('serviceRequestOptionDesc'))}</span>
            </button>
            <a class="contact-option" href="https://www.telia.fi/yrityksille/asiakastuki/yhteystiedot" target="_blank" rel="noopener noreferrer">
              <span class="contact-option-icon">📞</span>
              <span class="contact-option-title">${escapeHtml(t('otherWays'))}</span>

            <option value="${escapeHtml(t('mobileSubscription'))}">${escapeHtml(t('mobileSubscription'))}</option>
            <option value="${escapeHtml(t('businessInternet'))}">${escapeHtml(t('businessInternet'))}</option>
            <option value="${escapeHtml(t('license'))}">${escapeHtml(t('license'))}</option>
            <option value="${escapeHtml(t('securityService'))}">${escapeHtml(t('securityService'))}</option>
          </select></div>
          <div class="form-row"><label for="actionDescription">${t('modalDescription')}</label><textarea id="actionDescription" placeholder="${escapeHtml(t('orderNewServiceDesc'))}"></textarea></div>`;

        return `
          <div class="form-row"><label for="actionCompany">${t('modalCompany')}</label><select id="actionCompany">${companyOptions}</select></div>
          <div class="form-row"><label for="actionRequestType">${t('modalRequestType')}</label><select id="actionRequestType">
            <option value="${escapeHtml(t('requestUserChange'))}">${escapeHtml(t('requestUserChange'))}</option>
            <option value="${escapeHtml(t('requestBilling'))}">${escapeHtml(t('requestBilling'))}</option>
            <option value="${escapeHtml(t('requestServiceChange'))}">${escapeHtml(t('requestServiceChange'))}</option>
          </select></div>
          <div class="form-row"><label for="actionDescription">${t('modalDescription')}</label><textarea id="actionDescription" placeholder="${escapeHtml(t('createServiceRequestDesc'))}"></textarea></div>`;
      }
      return `
        <div class="form-row"><label for="actionCompany">${t('modalCompany')}</label><select id="actionCompany">${companyOptions}</select></div>

        <div class="form-row"><label for="actionIncidentType">${t('modalRequestType')}</label><select id="actionIncidentType">
          <option value="${escapeHtml(t('incidentMobileData'))}">${escapeHtml(t('incidentMobileData'))}</option>
          <option value="${escapeHtml(t('incidentInternet'))}">${escapeHtml(t('incidentInternet'))}</option>
          <option value="${escapeHtml(t('incidentDevice'))}">${escapeHtml(t('incidentDevice'))}</option>

    function openChatDemo() {
      state.activeActionType = 'chat';
      setModalHeader('💬', t('chatDemoTitle'));
      document.getElementById('actionModalBody').innerHTML = `<div class="empty">${escapeHtml(t('chatDemoText'))}</div>`;
      document.getElementById('actionModalSubmit').style.display = 'none';
    }

    function companyOptionsHtml() {
      const allowedIds = accessibleCompanyIds();
      const defaultCompanyId = state.selectedCompanyId === 'ALL' ? allowedIds[0] : state.selectedCompanyId;
      return (state.data.companies || []).filter(company => allowedIds.includes(company.companyId)).map(company => `
        <option value="${escapeHtml(company.companyId)}" ${company.companyId === defaultCompanyId ? 'selected' : ''}>
          ${escapeHtml(company.companyName)} (${escapeHtml(company.companyId)})
        </option>`).join('');
    }
    function assetOptionsHtml() {
      const companyId = state.selectedCompanyId === 'ALL' ? accessibleCompanyIds()[0] : state.selectedCompanyId;
      const assets = companyItems('assets').filter(asset => !companyId || asset.companyId === companyId);
      return assets.length
        ? assets.map(asset => `<option value="${escapeHtml(asset.name)}">${escapeHtml(asset.name)} · ${escapeHtml(asset.user || '-')}</option>`).join('')
        : `<option value="-">-</option>`;
    }
    function submitActionModal() {
      const type = state.activeActionType;
      const companyId = document.getElementById('actionCompany')?.value || state.data.companies[0]?.companyId || '';
      const company = state.data.companies.find(c => c.companyId === companyId) || {};
      const description = document.getElementById('actionDescription')?.value || '';
      const today = new Date().toISOString().slice(0, 10);
      const suffix = Date.now().toString().slice(-6);

      if (type === 'payInvoice') {
        const invoice = findRecord('invoices', state.activeRecordId);
        if (invoice) invoice.status = 'Maksettu';
        closeActionModal();
        renderAll();
        return;
      }
      if (type === 'reply-requests' || type === 'reply-incidents') {
        const recordType = state.activeRecordType;
        const recordId = state.activeRecordId;
        const item = findRecord(recordType, recordId);
        const replyText = document.getElementById('threadReplyText')?.value || '';
        if (item && replyText.trim()) {
          const messages = getThreadMessages(recordType, recordId, item);
          messages.push({ senderKey: 'customer', sender: t('customerSender'), date: new Date().toISOString().slice(0, 10), text: replyText.trim() });
          saveThreadMessages(recordType, recordId, messages);
        }
        closeActionModal();
        renderAll();
        return;
      }
      if (type === 'order') {
        const serviceType = document.getElementById('actionServiceType')?.value || t('mobileSubscription');
        state.data.orders.unshift({
          id: `DEMO-ORDER-${suffix}`,
          companyId,
          companyName: company.companyName || '',
          productType: serviceType,
          item: `${serviceType} Demo`,
          user: '',
          billingAccount: '',
          orderDate: today,
          status: 'Tilauksessa',
          category: 'Target'
        });
        state.activeTab = 'orders';
        state.statusFilter = null;
      }

      if (type === 'request') {
        const requestType = document.getElementById('actionRequestType')?.value || t('requestServiceChange');
        state.data.requests.unshift({
          id: `DEMO-REQ-${suffix}`,
          companyId,
          companyName: company.companyName || '',
          requestType,
          description: description || requestType,
          requestDate: today,
          status: 'Käsittelyssä',
          createdBy: 'Demo user'
        });
        state.activeTab = 'requests';
        state.statusFilter = 'openRequests';
      }

      if (type === 'incident') {
        const incidentType = document.getElementById('actionIncidentType')?.value || t('incidentMobileData');
        const affectedService = document.getElementById('actionAffectedService')?.value || '';
        state.data.incidents.unshift({
          id: `DEMO-INC-${suffix}`,
          companyId,
          companyName: company.companyName || '',
          category: incidentType,
          description: description || affectedService || incidentType,
          startDate: today,
          status: 'Selvityksessä'
        });
        state.activeTab = 'incidents';
        state.statusFilter = 'openIncidents';
      }

      state.selectedCompanyId = companyId;
      state.selectedItem = null;
      closeActionModal();
      renderAll();
    }

    function renderKpis() {
      const invoices = companyItems('invoices'), requests = companyItems('requests'), incidents = companyItems('incidents');
      const openInvoices = invoices.filter(i => i.status === 'Avoinna');
      const openRequests = requests.filter(r => r.status !== 'Valmis');
      const openIncidents = incidents.filter(i => i.status !== 'Ratkaistu');
      const notifications = [
        [t('openInvoicesNotification'), openInvoices.length, 'invoices', 'openInvoices', '🧾'],
        [t('openRequestsNotification'), openRequests.length, 'requests', 'openRequests', '🛠️'],
        [t('openIncidentsNotification'), openIncidents.length, 'incidents', 'openIncidents', '⚠️']
      ].filter(([, value]) => value > 0);

      const area = document.getElementById('kpiArea');
      if (!notifications.length) {
        area.innerHTML = '';
        area.style.display = 'none';
        return;
      }
      area.style.display = 'flex';
      area.innerHTML = notifications.map(([label, value, tab, filter, icon]) => {
        const isActive = state.activeTab === tab && (state.statusFilter || '') === filter;
        return `<button class="kpi ${isActive ? 'active' : ''}" type="button" data-tab="${tab}" data-filter="${filter}"><span>${icon}</span><span class="label">${label}</span><span class="value">${value}</span></button>`;
      }).join('');
      document.querySelectorAll('.kpi').forEach(card => card.addEventListener('click', () => {
        state.activeTab = card.dataset.tab;
        state.statusFilter = card.dataset.filter || null;
        state.selectedItem = null;
        renderKpis(); renderTabs(); renderList();
      }));
    }

    function renderTabs() {
      document.getElementById('tabs').innerHTML = availableTabs().map(tab => `<button class="tab ${state.activeTab === tab.id ? 'active' : ''}" data-tab="${tab.id}">${t(tab.labelKey)}</button>`).join('');
      document.querySelectorAll('.tab').forEach(btn => btn.addEventListener('click', () => {
        state.activeTab = btn.dataset.tab;
        state.statusFilter = null;
        state.selectedItem = null;
        renderAll();
      }));
      updateAssetViewToggleVisibility();
    }

    function updateAssetViewButtons() {
      document.getElementById('listViewBtn')?.classList.toggle('active', state.assetView === 'list');
      document.getElementById('tileViewBtn')?.classList.toggle('active', state.assetView === 'tile');
    }

    function updateAssetViewToggleVisibility() {
      const toggle = document.getElementById('assetViewToggle');
      if (!toggle) return;
      toggle.style.display = state.activeTab === 'assets' && state.searchMode === 'customer' ? 'flex' : 'none';
      updateAssetViewButtons();
    }

    function activeFilterLabel() {
      if (state.statusFilter === 'openInvoices') return t('filterOpenInvoices');
      if (state.statusFilter === 'openRequests') return t('filterOpenRequests');
      if (state.statusFilter === 'openIncidents') return t('filterOpenIncidents');
      return '';
    }

    function renderList() {
      const list = document.getElementById('listArea');
      const q = document.getElementById('searchInput').value.toLowerCase();
      const typeFilter = document.getElementById('typeSelect').value;
      let items = companyItems(state.activeTab);

      if (state.statusFilter === 'openInvoices') items = items.filter(item => item.status === 'Avoinna');
      if (state.statusFilter === 'openRequests') items = items.filter(item => item.status !== 'Valmis');
      if (state.statusFilter === 'openIncidents') items = items.filter(item => item.status !== 'Ratkaistu');

      if (state.activeTab === 'assets') {
        if (typeFilter !== 'all') items = items.filter(a => a.type === typeFilter);
        if (q) items = items.filter(a => [a.type, a.name, a.user, a.subscriptionTypeOrSpeed, a.category].join(' ').toLowerCase().includes(q));
      } else if (q) {
        items = items.filter(item => JSON.stringify(item).toLowerCase().includes(q));
      }

      document.getElementById('resultCount').textContent = `${items.length} ${t('rows')}`;
      if (!items.length) { list.innerHTML = `<div class="empty">${t('noResults')}</div>`; return; }

      const filterPrefix = activeFilterLabel() ? `<div class="filter-banner">${activeFilterLabel()}</div>` : '';
      if (state.activeTab === 'assets' && state.assetView === 'tile') {
        list.innerHTML = `${filterPrefix}<div class="tile-grid">${items.map(tileTemplate).join('')}</div>`;
        list.querySelectorAll('.asset-tile').forEach(tile => tile.addEventListener('click', () => { window.location.href = `asset-detail.html?id=${tile.dataset.id}`; }));
        return;
      }

      list.innerHTML = filterPrefix + items.map(item => rowTemplate(item, state.activeTab)).join('');
      list.querySelectorAll('.row').forEach(row => row.addEventListener('click', () => {
        if (state.activeTab === 'assets') window.location.href = `asset-detail.html?id=${row.dataset.id}`;
      }));
    }

    function renderContentSearch() {
      const area = document.getElementById('aiAnswerArea');
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      const content = state.data.contentSearch || [];
      if (!content.length) { area.innerHTML = `<div class="empty">${t('contentMissing')}</div>`; return; }
      if (!query) {
        area.innerHTML = `<div class="empty">${t('askTelia')}</div><div class="suggestion-list">${content.slice(0, 4).map(item => `<button class="suggestion-button" type="button" data-question="${escapeHtml(item.question || '')}">${escapeHtml(item.question || t('openExample'))}</button>`).join('')}</div>`;
        bindSuggestionButtons(); return;
      }
      const ranked = content.map(item => ({ item, score: contentScore(item, query) })).filter(result => result.score > 0).sort((a, b) => b.score - a.score);
      if (!ranked.length) { area.innerHTML = `<h3>${t('noDirectAnswer')}</h3><p class="ai-answer-text">${t('noMockAnswer')} "${escapeHtml(query)}".</p>`; return; }
      const best = ranked[0].item;
      const sources = best.sources || [];
      area.innerHTML = `<h3>${escapeHtml(best.question || t('aiAnswer'))}</h3><p class="ai-answer-text">${escapeHtml(best.answer || '')}</p><h3>${t('sources')}</h3><div class="source-list">${sources.length ? sources.map(source => `<a class="source-link" href="${escapeHtml(source.url || '#')}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.title || source.url || t('sources'))}</a>`).join('') : `<div class="mini-item">${t('noSources')}</div>`}</div>`;
    }

    function contentScore(item, query) {
      const words = query.split(/\s+/).filter(Boolean);
      const haystack = [item.question, item.answer, ...(item.keywords || [])].join(' ').toLowerCase();
      let score = 0;
      words.forEach(word => { if (haystack.includes(word)) score += 1; });
      if ((item.question || '').toLowerCase().includes(query)) score += 5;
      return score;
    }

    function bindSuggestionButtons() {
      document.querySelectorAll('.suggestion-button').forEach(button => {
        button.addEventListener('click', () => { document.getElementById('searchInput').value = button.dataset.question || ''; renderContentSearch(); });
      });
    }

    function rowTemplate(item, type) {
      const icon = iconFor(type, item);
      let primary = '', secondary = '', badge = '', details = [];
      if (type === 'assets') {
        primary = `${item.type}: ${item.name}`;
        secondary = [item.user, item.subscriptionTypeOrSpeed, item.companyName].filter(Boolean).join(' · ');
        badge = item.category || '';
        details = [[t('companyName'), item.companyName], [t('user'), item.user], [t('productSpeed'), item.subscriptionTypeOrSpeed], [t('category'), translateCategory(item.category)], [t('fixedTerm'), item.fixedTermEndDate]];
      } else if (type === 'orders') {
        primary = `${item.productType}: ${item.item}`;
        secondary = [item.companyName, item.user, translateStatus(item.status)].filter(Boolean).join(' · ');
        badge = item.status || '';
        details = [[t('companyName'), item.companyName], [t('user'), item.user], [t('billingAccount'), item.billingAccount], [t('orderDate'), item.orderDate], [t('status'), translateStatus(item.status)], [t('category'), translateCategory(item.category)]];
      } else if (type === 'invoices') {
        primary = `${item.invoiceType}: ${formatCurrency(item.amount)}`;
        secondary = [`${t('invoiceNumber')} ${item.invoiceNumber || ''}`, item.companyName, translateStatus(item.status)].filter(Boolean).join(' · ');
        badge = item.status || '';
        details = [[t('companyName'), item.companyName], [t('invoiceNumber'), item.invoiceNumber], [t('invoiceDate'), item.invoiceDate], [t('billingAccount'), item.billingAccount], [t('referenceNumber'), item.referenceNumber], [t('status'), translateStatus(item.status)]];
      } else if (type === 'requests') {
        primary = item.requestType;
        secondary = [item.companyName, translateStatus(item.status), item.requestDate].filter(Boolean).join(' · ');
        badge = item.status || '';
        details = [[t('companyName'), item.companyName], [t('description'), item.description], [t('requestDate'), item.requestDate], [t('createdBy'), item.createdBy], [t('status'), translateStatus(item.status)]];
      } else if (type === 'incidents') {
        primary = item.category;
        secondary = [item.companyName, translateStatus(item.status), item.startDate].filter(Boolean).join(' · ');
        badge = item.status || '';
        details = [[t('companyName'), item.companyName], [t('description'), item.description], [t('startDate'), item.startDate], [t('status'), translateStatus(item.status)]];
      }
      return `
        <div class="row" data-id="${escapeHtml(item.id)}">
          <div class="icon">${icon}</div>
          <div>
            <div class="primary">${escapeHtml(primary || '-')}</div>
            <div class="secondary">${escapeHtml(secondary || '-')}</div>
            <div class="row-details">${detailChips(details)}</div>
            ${rowActions(item, type)}
          </div>
          <span class="badge ${badgeClass(badge)}">${escapeHtml(translateStatus(translateCategory(badge)))}</span>
        </div>`;
    }

    function rowActions(item, type) {
      const id = escapeHtml(item.id || '');
      if (type === 'assets') return `<div class="row-actions"><a class="row-action-button primary" href="asset-detail.html?id=${id}" onclick="event.stopPropagation()">${t('showDetails')}</a></div>`;
      if (type === 'orders') return `<div class="row-actions"><button class="row-action-button" type="button" onclick="openOrderDetail(event, '${id}')">${t('showOrder')}</button><button class="row-action-button primary" type="button" onclick="askAboutOrder(event, '${id}')">${t('askAboutOrder')}</button></div>`;
      if (type === 'invoices') return `<div class="row-actions"><button class="row-action-button" type="button" onclick="openInvoiceDetail(event, '${id}')">${t('showInvoice')}</button><button class="row-action-button" type="button" onclick="openInvoicePdf(event, '${id}')">${t('invoicePdf')}</button><button class="row-action-button primary" type="button" onclick="openPayInvoice(event, '${id}')">${t('payInvoice')}</button></div>`;
      if (type === 'requests') return `<div class="row-actions"><button class="row-action-button" type="button" onclick="openThreadModal(event, 'requests', '${id}', false)">${t('openConversation')}</button><button class="row-action-button primary" type="button" onclick="openThreadModal(event, 'requests', '${id}', true)">${t('reply')}</button></div>`;
      if (type === 'incidents') return `<div class="row-actions"><button class="row-action-button" type="button" onclick="openThreadModal(event, 'incidents', '${id}', false)">${t('openConversation')}</button><button class="row-action-button primary" type="button" onclick="openThreadModal(event, 'incidents', '${id}', true)">${t('reply')}</button></div>`;
      return '';
    }

    function detailChips(details) {
      return details
        .filter(([, value]) => value !== undefined && value !== null && String(value).trim() !== '')
        .map(([label, value]) => `<span class="row-detail-chip"><span>${escapeHtml(label)}:</span> <strong>${escapeHtml(String(value))}</strong></span>`)
        .join('');
    }





    function modalHeaderHtml(icon, title, subtitle = '') {
      return `<span class="modal-title-line"><span class="modal-title-icon">${icon}</span><span><span>${escapeHtml(title)}</span>${subtitle ? `<div class="modal-subtitle">${escapeHtml(subtitle)}</div>` : ''}</span></span>`;
    }

    function setModalHeader(icon, title, subtitle = '') {
      document.getElementById('actionModalTitle').innerHTML = modalHeaderHtml(icon, title, subtitle);
    }

    function statusBanner(status) {
      if (!status) return '';
      return `<div class="status-banner ${statusClass(status)}">${statusIcon(status)} ${escapeHtml(translateStatus(status))}</div>`;
    }

    function statusClass(status) {
      const value = String(status || '').toLowerCase();
      if (value.includes('maksettu') || value.includes('ratkaistu')) return 'paid resolved';
      if (value.includes('valmis')) return 'completed';
      if (value.includes('selvityks') || value.includes('käsittely')) return 'progress';
      if (value.includes('avoin') || value.includes('tilauksessa')) return 'open';
      return '';
    }

    function statusIcon(status) {
      const value = String(status || '').toLowerCase();
      if (value.includes('maksettu') || value.includes('valmis') || value.includes('ratkaistu')) return '🟢';
      if (value.includes('selvityks') || value.includes('käsittely')) return '🟣';
      if (value.includes('tilauksessa') || value.includes('avoin')) return '🟡';
      return 'ℹ️';
    }

    function timelineSection(items) {
      const clean = items.filter(item => item && item.text);
      if (!clean.length) return '';
      return `<div><h3>${escapeHtml(t('timeline'))}</h3><div class="timeline">${clean.map(item => `<div class="timeline-item"><strong>${escapeHtml(item.date || '')}</strong> ${escapeHtml(item.text)}</div>`).join('')}</div></div>`;
    }

    function orderTimeline(order) {
      return timelineSection([
        { date: order.orderDate, text: `${t('created')}: ${order.item || order.productType || '-'}` },
        { date: order.orderDate, text: `${t('status')}: ${translateStatus(order.status)}` }
      ]);
    }

    function invoiceTimeline(invoice) {
      return timelineSection([
        { date: invoice.invoiceDate, text: `${t('created')}: ${invoice.invoiceNumber || '-'}` },
        { date: invoice.invoiceDate, text: `${t('status')}: ${translateStatus(invoice.status)}` }
      ]);
    }

    function threadTimeline(item, type) {
      const messages = getThreadMessages(type, item.id, item);
      return timelineSection(messages.map((message, index) => ({ date: message.date, text: `${index === 0 ? t('created') : t('updated')}: ${message.sender}` })));
    }

    function invoicePdfPreview(invoice) {
      return `<div class="pdf-preview"><div class="pdf-preview-header"><div class="pdf-preview-title">TELIA</div><div>${escapeHtml(t('pdfPreview'))}</div></div>${recordSummary([[t('invoiceNumber'), invoice.invoiceNumber], [t('invoiceDate'), invoice.invoiceDate], [t('companyName'), invoice.companyName], [t('billingAccount'), invoice.billingAccount], [t('referenceNumber'), invoice.referenceNumber], [t('status'), translateStatus(invoice.status)]])}<div class="pdf-preview-total">${escapeHtml(t('amount'))}: ${escapeHtml(formatCurrency(invoice.amount))}</div></div>`;
    }

    function findRecord(type, id) {
      return (state.data[type] || []).find(item => String(item.id) === String(id));
    }

    function recordSummary(rows) {
      return `<div class="record-summary">${rows.filter(([, value]) => value !== undefined && value !== null && String(value).trim() !== '').map(([label, value]) => `<div class="record-summary-item"><div class="record-summary-label">${escapeHtml(label)}</div><div class="record-summary-value">${escapeHtml(String(value))}</div></div>`).join('')}</div>`;
    }

    function showModalContent(title, html, icon = 'ℹ️', subtitle = '') {
      state.activeActionType = 'contentOnly';
      setModalHeader(icon, title, subtitle);
      document.getElementById('actionModalBody').innerHTML = html;
      document.getElementById('actionModalCancel').textContent = t('modalCancel');
      document.getElementById('actionModalSubmit').style.display = 'none';
      document.getElementById('actionModal').hidden = false;
    }

    function openOrderDetail(event, id) {
      event?.stopPropagation?.();
      const order = findRecord('orders', id);
      if (!order) return;
      showModalContent(`${t('orders')} · ${order.item || order.productType || id}`, `${statusBanner(order.status)}${recordSummary([[t('companyName'), order.companyName], [t('productType'), order.productType], [t('item'), order.item], [t('user'), order.user], [t('billingAccount'), order.billingAccount], [t('orderDate'), order.orderDate], [t('status'), translateStatus(order.status)], [t('category'), translateCategory(order.category)]])}${orderTimeline(order)}`, '📦', order.companyName || '');
    }


    function askAboutOrder(event, id) {
      event?.stopPropagation?.();
      const order = findRecord('orders', id);
      if (!order) return;
      openActionModal('request');
      const requestType = document.getElementById('actionRequestType');
      const description = document.getElementById('actionDescription');
      if (requestType) requestType.value = t('requestServiceChange');
      if (description) description.value = `${t('askAboutOrder')}: ${order.item || order.productType || id}\n\n${t('orderQuestionText')}`;
    }

    function openInvoiceDetail(event, id) {
      event?.stopPropagation?.();
      const invoice = findRecord('invoices', id);
      if (!invoice) return;
      showModalContent(`${t('invoices')} · ${invoice.invoiceNumber || id}`, `${statusBanner(invoice.status)}${recordSummary([[t('companyName'), invoice.companyName], [t('invoiceType'), invoice.invoiceType], [t('invoiceNumber'), invoice.invoiceNumber], [t('invoiceDate'), invoice.invoiceDate], [t('billingAccount'), invoice.billingAccount], [t('referenceNumber'), invoice.referenceNumber], [t('amount'), formatCurrency(invoice.amount)], [t('status'), translateStatus(invoice.status)]])}${invoiceTimeline(invoice)}`, '🧾', invoice.companyName || '');
    }


    function openInvoicePdf(event, id) {
      event?.stopPropagation?.();
      const invoice = findRecord('invoices', id);
      if (!invoice) return;
      showModalContent(t('invoicePdfTitle'), `${invoicePdfPreview(invoice)}<p>${escapeHtml(t('invoicePdfText'))}</p>`, '📄', invoice.invoiceNumber || '');
    }


    function openPayInvoice(event, id) {
      event?.stopPropagation?.();
      const invoice = findRecord('invoices', id);
      if (!invoice) return;
      state.activeActionType = 'payInvoice';
      state.activeRecordId = id;
      setModalHeader('💳', t('paymentSummary'), invoice.invoiceNumber || '');
      document.getElementById('actionModalBody').innerHTML = `${statusBanner(invoice.status)}${recordSummary([[t('invoiceNumber'), invoice.invoiceNumber], [t('companyName'), invoice.companyName], [t('amount'), formatCurrency(invoice.amount)], [t('referenceNumber'), invoice.referenceNumber], [t('status'), translateStatus(invoice.status)]])}${invoiceTimeline(invoice)}`;
      document.getElementById('actionModalCancel').textContent = t('modalCancel');
      const submitButton = document.getElementById('actionModalSubmit');
      submitButton.textContent = t('confirmPayment');
      submitButton.style.display = 'inline-block';
      document.getElementById('actionModal').hidden = false;
    }


    function openThreadModal(event, type, id, replyMode) {
      event?.stopPropagation?.();
      const item = findRecord(type, id);
      if (!item) return;
      state.activeActionType = replyMode ? `reply-${type}` : 'threadOnly';
      state.activeRecordType = type;
      state.activeRecordId = id;
      setModalHeader(type === 'requests' ? '🛠️' : '⚠️', `${t('messageThread')} · ${threadTitle(item, type)}`, item.companyName || '');
      document.getElementById('actionModalBody').innerHTML = `${statusBanner(item.status)}${threadTimeline(item, type)}${renderThread(item, type)}${replyMode ? `<div class="form-row"><label for="threadReplyText">${t('reply')}</label><textarea id="threadReplyText"></textarea></div>` : ''}`;
      document.getElementById('actionModalCancel').textContent = t('modalCancel');
      const submitButton = document.getElementById('actionModalSubmit');
      submitButton.textContent = t('sendReply');
      submitButton.style.display = replyMode ? 'inline-block' : 'none';
      document.getElementById('actionModal').hidden = false;
    }


    function threadTitle(item, type) {
      if (type === 'requests') return item.requestType || item.id;
      if (type === 'incidents') return item.category || item.id;
      return item.id || '';
    }

    function renderThread(item, type) {
      const messages = getThreadMessages(type, item.id, item);
      return `<div class="thread">${messages.map(message => `<div class="thread-message ${message.senderKey === 'customer' ? 'customer' : ''}"><div class="thread-meta">${escapeHtml(message.sender)} · ${escapeHtml(message.date)}</div><div class="thread-text">${escapeHtml(message.text)}</div></div>`).join('')}</div>`;
    }

    function getThreadMessages(type, id, item) {
      const key = `mtyThread-${type}-${id}`;
      const saved = localStorage.getItem(key);
      if (saved) {
        try { return JSON.parse(saved); } catch (error) { /* ignore */ }
      }
      const date = item.requestDate || item.startDate || new Date().toISOString().slice(0, 10);
      return [
        { senderKey: 'telia', sender: t('teliaSender'), date, text: item.description || threadTitle(item, type) || '-' },
        { senderKey: 'customer', sender: t('customerSender'), date, text: type === 'requests' ? t('createServiceRequestDesc') : t('reportIncidentDesc') }
      ];
    }

    function saveThreadMessages(type, id, messages) {
      localStorage.setItem(`mtyThread-${type}-${id}`, JSON.stringify(messages));
    }

    function tileTemplate(item) {
      const icon = iconFor('assets', item);
      return `<div class="asset-tile" data-id="${escapeHtml(item.id)}"><div class="asset-tile-title">${icon} ${escapeHtml(item.name || '-')}</div><div class="asset-tile-sub">${escapeHtml(item.type || '-')}</div><div class="asset-tile-sub">${t('companyName')}: ${escapeHtml(item.companyName || '-')}</div><div class="asset-tile-sub">${t('user')}: ${escapeHtml(item.user || '-')}</div><div class="asset-tile-sub">${t('productSpeed')}: ${escapeHtml(item.subscriptionTypeOrSpeed || '-')}</div><div class="asset-tile-sub">${t('fixedTerm')}: ${escapeHtml(item.fixedTermEndDate || '-')}</div><div style="margin-top:12px"><span class="badge ${badgeClass(item.category)}">${escapeHtml(translateCategory(item.category || ''))}</span></div><a class="detail-link" href="asset-detail.html?id=${escapeHtml(item.id)}" onclick="event.stopPropagation()">${t('showDetails')}</a></div>`;
    }



    function setDetailPanelTitle(title) {
      // Detail pane removed in full-width list view.
    }

    function customerSummary() {
      setDetailPanelTitle(t('companySummary'));
      const isAllCompanies = state.selectedCompanyId === 'ALL';
      const company = state.data.companies.find(c => c.companyId === state.selectedCompanyId);
      const companyDisplayName = isAllCompanies ? t('allCompanies') : (company?.companyName || '-');
      const assets = companyItems('assets'), invoices = companyItems('invoices'), orders = companyItems('orders'), requests = companyItems('requests'), incidents = companyItems('incidents');
      const openInvoices = invoices.filter(i => i.status === 'Avoinna'), openRequests = requests.filter(r => r.status !== 'Valmis'), openIncidents = incidents.filter(i => i.status !== 'Ratkaistu');
      return `<div class="summary-card"><div class="summary-row"><span>${t('companyName')}</span><strong>${escapeHtml(companyDisplayName)}</strong></div>${isAllCompanies ? `<div class="summary-row"><span>${t('companies')}</span><strong>${state.data.companies.length}</strong></div>` : ''}<div class="summary-row"><span>${t('assets')}</span><strong>${assets.length}</strong></div><div class="summary-row"><span>${t('orders')}</span><strong>${orders.length}</strong></div><div class="summary-row"><span>${t('openInvoices')}</span><strong>${openInvoices.length}</strong></div><div class="summary-row"><span>${t('openRequests')}</span><strong>${openRequests.length}</strong></div><div class="summary-row"><span>${t('openIncidents')}</span><strong>${openIncidents.length}</strong></div></div><div class="empty">${t('selectFromList')}</div>`;
    }

    function renderDetail() {
      const area = document.getElementById('detailArea');
      if (!state.selectedItem) { area.innerHTML = customerSummary(); return; }
      const item = (state.data[state.selectedItem.type] || []).find(x => x.id === state.selectedItem.id);
      if (!item) return;
      if (state.selectedItem.type === 'assets') area.innerHTML = assetDetail(item);
      if (state.selectedItem.type === 'orders') area.innerHTML = genericDetail(`${t('orders')} · ${item.item || item.productType || ''}`, item, ['productType','item','user','billingAccount','orderDate','status','category']);
      if (state.selectedItem.type === 'invoices') area.innerHTML = genericDetail(`${t('invoices')} · ${item.invoiceNumber || ''}`, item, ['invoiceType','invoiceDate','status','invoiceNumber','billingAccount','amount','referenceNumber','category']);
      if (state.selectedItem.type === 'requests') area.innerHTML = genericDetail(item.requestType || t('requests'), item, ['requestType','description','requestDate','status','createdBy']);
      if (state.selectedItem.type === 'incidents') area.innerHTML = genericDetail(item.category || t('incidents'), item, ['category','description','startDate','status']);
    }

    function assetDetail(asset) {
      setDetailPanelTitle(asset.name || t('assets'));
      const relatedOrders = companyItems('orders').filter(o => o.item === asset.name || o.user === asset.user || o.productType === asset.type).slice(0, 4);
      const actions = actionsForAsset(asset);
      return `<div class="detail-subtitle">${escapeHtml(asset.type)} · ${escapeHtml(asset.companyName)}</div><div class="info-grid">${info(t('user'), asset.user || '-')}${info(t('productSpeed'), asset.subscriptionTypeOrSpeed || '-')}${info(t('category'), translateCategory(asset.category || '-'))}${info(t('fixedTerm'), asset.fixedTermEndDate || '-')}</div><div class="actions"><h3>${t('actions')}</h3>${actions.length ? actions.map(a => `<button class="action-button" type="button">${escapeHtml(a)}</button>`).join('') : `<div class="empty">${t('noActions')}</div>`}</div><div class="related"><h3>${t('relatedOrders')}</h3><div class="mini-list">${relatedOrders.length ? relatedOrders.map(o => `<div class="mini-item"><strong>${escapeHtml(o.productType)}</strong><br>${escapeHtml(o.item)} · ${escapeHtml(translateStatus(o.status))}</div>`).join('') : `<div class="mini-item">${t('noRelatedOrders')}</div>`}</div></div>`;
    }

    function genericDetail(title, item, fields) {
      setDetailPanelTitle(title);
      const labels = { productType: t('productType'), item: t('item'), user: t('user'), billingAccount: t('billingAccount'), orderDate: t('orderDate'), status: t('status'), category: t('category'), invoiceType: t('invoiceType'), invoiceDate: t('invoiceDate'), invoiceNumber: t('invoiceNumber'), amount: t('amount'), referenceNumber: t('referenceNumber'), requestType: t('requestType'), description: t('description'), requestDate: t('requestDate'), createdBy: t('createdBy'), startDate: t('startDate') };
      return `<div class="detail-subtitle">${escapeHtml(item.companyName || '')}</div><div class="info-grid">${fields.map(f => info(labels[f] || f, f === 'amount' ? formatCurrency(item[f]) : f === 'status' ? translateStatus(item[f]) : f === 'category' ? translateCategory(item[f]) : (item[f] || '-'))).join('')}</div>`;
    }

    function actionsForAsset(asset) {
      const actions = state.data.detailActions || {};
      if (asset.type === 'Matkapuhelin liittymä' && asset.category === 'Target') return actions['Matkapuhelin liittymä Target'] || [];
      if (asset.type === 'Matkapuhelin liittymä') return actions['Matkapuhelin liittymä Legacy'] || [];
      return actions[asset.type] || [];
    }

    function info(name, value) { return `<div class="info"><div class="name">${escapeHtml(name)}</div><div class="val">${escapeHtml(String(value))}</div></div>`; }

    function iconFor(type, item) {
      if (type === 'assets') {
        if (item.type === 'Matkapuhelin liittymä') return '📱';
        if (item.type === 'Laite') return '💻';
        if (item.type === 'Yritysnetti') return '🌐';
        if (item.type === 'Lisenssi') return '🔑';
      }
      return { orders: '📦', invoices: '🧾', requests: '🛠️', incidents: '⚠️' }[type] || '•';
    }

    function badgeClass(value) {
      const v = String(value || '').toLowerCase();
      if (v.includes('target')) return 'target';
      if (v.includes('legacy')) return 'legacy';
      if (v.includes('avoin') || v.includes('tilauksessa') || v.includes('selvityksessä') || v.includes('käsittelyssä')) return 'open';
      return '';
    }

    function formatCurrency(value) {
      const amount = Number(value || 0);
      return new Intl.NumberFormat('fi-FI', { style: 'currency', currency: 'EUR' }).format(amount);
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
      }[char]));
    }



    function renderSettingsModalBody() {
      const user = currentDemoUser();
      const canManageUsers = user.role === 'admin';
      const userRows = demoUsers.map(demoUser => `
        <button class="demo-user-card ${demoUser.id === state.currentUserId ? 'active' : ''}" type="button" onclick="switchDemoUser('${escapeHtml(demoUser.id)}')">
          <span class="demo-user-name"><span>${demoUser.id === state.currentUserId ? '✅ ' : '👤 '}${escapeHtml(demoUser.name)}</span><span class="role-badge ${escapeHtml(demoUser.role)}">${escapeHtml(roleLabel(demoUser.role))}</span></span>
          <span class="demo-user-meta">${escapeHtml(demoUser.email)}</span>
          <span class="demo-user-meta">${escapeHtml(visibleCompaniesText(demoUser))}</span><span class="demo-user-meta">${escapeHtml(visibleDataText(demoUser))}</span>
        </button>`).join('');
      const managementRows = demoUsers.map(demoUser => `
        <div class="user-management-row">
          <div><strong>${escapeHtml(demoUser.name)}</strong><div class="demo-user-meta">${escapeHtml(demoUser.email)}</div></div>
          <div><span class="role-badge ${escapeHtml(demoUser.role)}">${escapeHtml(roleLabel(demoUser.role))}</span></div>
          <div>${escapeHtml(demoUser.role === 'admin' ? t('allCompanies') : demoUser.role === 'enduser' ? (demoUser.assetUser || '-') : (demoUser.companyIds || []).map(companyNameById).join(', '))}</div>
          <div class="settings-actions">
            <button class="settings-action-button" type="button" onclick="openPermissionDemo('${escapeHtml(demoUser.id)}')">${escapeHtml(t('editPermissions'))}</button>
          </div>
        </div>`).join('');
      return `
        <div class="settings-intro">${escapeHtml(t('userManagementDesc'))}</div>
        <div class="settings-grid">
          <div class="settings-card">
            <h4>${escapeHtml(t('demoUser'))}</h4>
            <p>${escapeHtml(t('userManagementDesc'))}</p>
            <div class="demo-user-list">${userRows}</div>
          </div>
          <div class="settings-card">
            <h4>${escapeHtml(t('visibleData'))}</h4>
            <div class="access-summary">
              <div class="access-row"><strong>${escapeHtml(t('currentUser'))}</strong>${escapeHtml(user.name)} · ${escapeHtml(roleLabel(user.role))}</div>
              <div class="access-row"><strong>${escapeHtml(t('role'))}</strong>${escapeHtml(roleDescription(user.role))}</div>
              <div class="access-row"><strong>${escapeHtml(t('visibleCompanies'))}</strong>${escapeHtml(visibleCompaniesText(user))}</div>
              <div class="access-row"><strong>${escapeHtml(t('visibleData'))}</strong>${escapeHtml(visibleDataText(user))}</div>
            </div>
          </div>
        </div>
        <div class="settings-card">
          <h4>${escapeHtml(t('userManagement'))}</h4>
          ${canManageUsers ? `
            <p>${escapeHtml(t('adminRoleDesc'))}</p>
            <div class="settings-actions"><button class="settings-action-button primary" type="button" onclick="openPermissionDemo('new')">+ ${escapeHtml(t('addUser'))}</button></div>
            <div class="user-management-table" style="margin-top:12px">
              <div class="user-management-row header"><div>${escapeHtml(t('user'))}</div><div>${escapeHtml(t('role'))}</div><div>${escapeHtml(t('visibleCompanies'))}</div><div>${escapeHtml(t('actions'))}</div></div>
              ${managementRows}
            </div>` : `<div class="empty">${escapeHtml(t('noAccessToTab'))}</div>`}
        </div>`;
    }
    function switchDemoUser(userId) {
      state.currentUserId = userId;
      localStorage.setItem('mtyCurrentUserId', userId);
      state.selectedCompanyId = pickDefaultCompany();
      state.selectedItem = null;
      state.statusFilter = null;
      ensureAllowedState();
      document.getElementById('settingsModalBody').innerHTML = renderSettingsModalBody();
      renderAll();
    }
    function openPermissionDemo(userId) {
      const demoUser = demoUsers.find(user => user.id === userId);
      const title = userId === 'new' ? t('addUser') : `${t('permissionDemoTitle')} · ${demoUser?.name || ''}`;
      const html = `<div class="empty">${escapeHtml(t('permissionDemoText'))}</div>`;
      showModalContent(title, html, '🔐', demoUser ? roleLabel(demoUser.role) : t('userManagement'));
    }
    function openSettingsModal() {
      document.getElementById('settingsModalTitle').textContent = `⚙️ ${t('settings')}`;
      document.getElementById('settingsModalBody').innerHTML = renderSettingsModalBody();
      document.getElementById('settingsModalCloseButton').textContent = t('modalCancel');
      document.getElementById('settingsModal').hidden = false;
    }
    function closeSettingsModal() {
      document.getElementById('settingsModal').hidden = true;
    }

    loadData().catch(error => {
      document.body.innerHTML = `<main style="padding:32px;font-family:Segoe UI,Arial"><h1>Demoa ei voitu ladata</h1><p>${escapeHtml(error.message)}</p><p>Varmista, että data-kansio on mukana GitHubissa.</p></main>`;
    });
  </script>
</body>
</html>
